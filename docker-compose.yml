services:
  postgres:
    image: postgres:16-alpine
    container_name: opsagent-postgres
    environment:
      POSTGRES_USER: opsagent
      POSTGRES_PASSWORD: opsagent
      POSTGRES_DB: opsagent
    ports:
      - "5437:5432"
    volumes:
      - opsagent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsagent -d opsagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opsagent-pgdata:
